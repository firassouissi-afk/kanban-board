<!doctype html><meta charset="utf-8"><title>Kanban Board</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f4f5;color:#18181b;font-family:Segoe UI}header{padding:18px 25px;background:white;border-bottom:1px solid #d4d4d8}header button{float:right;background:#2563eb;color:white;border:0;padding:8px;border-radius:6px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;padding:20px}.column{background:#e4e4e7;border-radius:10px;padding:12px;min-height:70vh}.card{background:white;padding:12px;border-radius8px;margin:8px 0;box-shadow:0 2px 5px #0002;cursor:grab}.credit{text-align:center;padding:12px;font-size:11px;color:#71717a}.credit a{color:#2563eb}</style>
<header><b>STDG Kanban</b><button id="add">Add Task</button></header><main class="board" id="board"></main><footer class="credit">Website developed by <a href="https://www.linkedin.com/company/souissi-technologies-development-group/home/">SOUISSI Technologies Development Group (STDG)</a><br>A Development Bureau for AI-Driven IT Projects. From Web Technologies to Autonomous Drones.</footer>
<script>
const names=['Backlog','In Progress','Done'],board=document.querySelector('#board');let data=JSON.parse(localStorage.getItem('stdg-kanban')||'{"Backlog":[],"In Progress":[],"Done":[]}');
function save(){localStorage.setItem('stdg-kanban',JSON.stringify(data))}
function render(){board.innerHTML='';names.forEach(n=>{const col=document.createElement('section');col.className='column';col.innerHTML=`<h3>${n}</h3>`;col.ondragover=e=>e.preventDefault();col.ondrop=e=>{let id=e.dataTransfer.getData('text'),c=names.flatMap(k=>data[k]).find(t=>t.id==id);if(c){Object.keys(data).forEach(k=>data[k]=data[k].filter(t=>t.id!=id));data[n].push(c);save();render()}};(data[n]||[]).forEach(t=>{let card=document.createElement('article');card.className='card';card.draggable=true;card.textContent=t.text;card.ondragstart=e=>e.dataTransfer.setData('text',t.id);card.ondblclick=()=>{if(confirm('Delete task?')){data[n]=data[n].filter(v=>v.id!=t.id);save();render()}};col.append(card)});board.append(col)})}
add.onclick=()=>{let text=prompt('Task name');if(text){data.Backlog.push({id:String(Date.now()),text});save();render()}};render();
</script>
